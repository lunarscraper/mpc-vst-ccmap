<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16171a">
<title>CC Map</title>
<style>
/* Phone view of CC Map, served by the plugin itself (no external files: it must work offline in the
   Force's WLAN). Graphite like the plugin skin; the Launch Control template colour tints the header. */
:root {
  --bg: #16171a; --panel: #23252a; --line: #34363c; --fg: #ecE9e2; --muted: #9b988f; --accent: #ff8a2a;
  --tmpl: #555; --hot: #ffd36b;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); }
body { padding: env(safe-area-inset-top, 0) 12px calc(env(safe-area-inset-bottom, 0) + 24px); }
header { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 10px 0 8px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tmpl { display: inline-flex; align-items: center; gap: 8px; font: 700 20px var(--sans); }
.dot { width: 16px; height: 16px; border-radius: 50%; background: var(--tmpl); box-shadow: 0 0 10px var(--tmpl); }
.chip { font: 600 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; }
.chip.learn { color: #fff; background: #c0392b; border-color: #c0392b; }
.last { font: 500 15px var(--mono); color: var(--hot); min-height: 20px; overflow-wrap: anywhere; }
.off { color: var(--muted); }
h2 { font: 600 13px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.ctl { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px 9px; display: grid; gap: 5px; justify-items: center; text-align: center; min-width: 0; cursor: pointer; font: inherit; color: inherit; }
.ctl.empty { opacity: .45; }
.ctl.hot { border-color: var(--hot); box-shadow: 0 0 0 1px var(--hot) inset; }
.ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.nr { font: 600 11px var(--mono); color: var(--muted); }
.name { font: 700 14px/1.15 var(--sans); overflow-wrap: anywhere; min-height: 32px; display: flex; align-items: center; }
.tgt { font: 400 10px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
svg.arc { width: 46px; height: 46px; }
.pad { width: 42px; height: 42px; border-radius: 7px; border: 1px solid #44474d; background: #2c2e33; }
.list { display: grid; gap: 6px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.item.hot { border-color: var(--hot); }
.item .name { min-height: 0; font-size: 15px; }
.bar { grid-column: 1 / -1; height: 5px; background: #33353b; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.val { font: 600 15px var(--mono); }
.hint { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 2px solid var(--accent); padding: 14px 14px calc(env(safe-area-inset-bottom, 0) + 14px); display: grid; gap: 10px; z-index: 5; }
.sheet input { font: 600 18px var(--sans); padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
.sheet .btns { display: flex; gap: 8px; }
.sheet button { flex: 1; font: 700 16px var(--sans); padding: 12px; border-radius: 8px; border: 0; background: #3a3d44; color: var(--fg); }
.sheet button.save { background: var(--accent); color: #141414; }
.status { position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0) + 8px); font: 11px var(--mono); color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="row"><span class="tmpl"><span class="dot"></span><span id="tmpl">Launch Control</span></span>
    <span class="chip" id="page">Seite 1</span><span class="chip learn" id="learn" hidden>Learn</span></div>
  <div class="last" id="last">–</div>
</header>

<h2>Launch Control · Regler</h2>
<div class="grid" id="knobs"></div>
<h2>Pads</h2>
<div class="grid" id="pads"></div>
<h2 id="oh" hidden>Weitere Controller</h2>
<div class="list" id="others"></div>
<p class="hint">Tippe einen Regler an, um ihm einen Namen zu geben. Die Namen speichert CC Map mit Projekt und Preset.</p>

<div class="sheet" id="sheet" hidden>
  <div id="sh-title" style="font:600 14px var(--sans); color: var(--muted)"></div>
  <input id="sh-name" maxlength="23" autocomplete="off" placeholder="Name, z. B. Cutoff">
  <div class="btns"><button type="button" id="sh-cancel">Abbrechen</button><button type="button" id="sh-clear">Löschen</button><button type="button" class="save" id="sh-save">Speichern</button></div>
</div>
<div class="status" id="status"></div>

<script>
/* Launch Control LED byte (16*green + red + flags) -> screen colour */
function ledColour(v) {
  const r = v & 3, g = (v >> 4) & 3;
  if (!r && !g) return null;
  const R = [0, 120, 190, 255][r], G = [0, 110, 175, 235][g];
  return "rgb(" + R + "," + G + ",40)";
}
const $ = (id) => document.getElementById(id);
function arc(val) {
  const a0 = 135, span = 270, f = val < 0 ? 0 : val / 127, r = 18, c = 23;
  const p = (deg) => { const t = (deg - 90) * Math.PI / 180; return [c + r * Math.cos(t), c + r * Math.sin(t)]; };
  const [x0, y0] = p(a0 + 90), [x1, y1] = p(a0 + 90 + span * f), [xe, ye] = p(a0 + 90 + span);
  const big = span * f > 180 ? 1 : 0;
  return '<svg class="arc" viewBox="0 0 46 46" aria-hidden="true"><path d="M' + x0 + ' ' + y0 + ' A' + r + ' ' + r + ' 0 1 1 ' + xe + ' ' + ye +
    '" fill="none" stroke="#3a3c42" stroke-width="5" stroke-linecap="round"/>' +
    (f > 0 ? '<path d="M' + x0 + ' ' + y0 + ' A' + r + ' ' + r + ' 0 ' + big + ' 1 ' + x1 + ' ' + y1 + '" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>' : "") +
    '<text x="23" y="27" text-anchor="middle" font-size="11" font-family="monospace" fill="#ecE9e2">' + (val < 0 ? "–" : val) + "</text></svg>";
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let st = null, editing = -1;

function ctlHtml(k, i, isPad) {
  const label = k.slot < 0 ? "frei" : (k.label || (isPad ? "Pad " + (i + 1) : "Regler " + (i + 1)));
  const hot = st && k.slot >= 0 && k.slot === st.last_slot;
  const visual = isPad ? '<div class="pad" style="background:' + (ledColour(k.led) || "#2c2e33") + '"></div>' : arc(k.val);
  return '<button type="button" class="ctl' + (k.slot < 0 ? " empty" : "") + (hot ? " hot" : "") + '" data-slot="' + k.slot + '" data-what="' +
    esc((isPad ? "Pad " : "Regler ") + (i + 1)) + '"><span class="nr">' + (isPad ? "P" : "K") + (i + 1) + "</span>" + visual +
    '<span class="name">' + esc(label) + '</span><span class="tgt">' + esc(k.slot < 0 ? "" : k.target) + "</span></button>";
}
function render() {
  if (!st) return;
  document.documentElement.style.setProperty("--tmpl", ledColour(st.tmpl_led) || "#555");
  $("tmpl").textContent = st.lc ? "LC " + st.tmpl : "Launch Control nicht gefunden";
  $("page").textContent = "Seite " + st.page;
  $("learn").hidden = !st.learn;
  $("last").textContent = st.last || "–";
  $("knobs").innerHTML = st.knobs.map((k, i) => ctlHtml(k, i, false)).join("");
  $("pads").innerHTML = st.pads.map((k, i) => ctlHtml(k, i, true)).join("");
  $("oh").hidden = !st.others.length;
  $("others").innerHTML = st.others.map((o) => {
    const v = o.val < 0 ? 0 : o.val;
    return '<button type="button" class="item' + (o.slot === st.last_slot ? " hot" : "") + '" data-slot="' + o.slot + '" data-what="' + esc(o.src) +
      '"><span><span class="name">' + esc(o.label || o.src) + '</span><span class="tgt">' + esc(o.src + " → " + o.target) +
      '</span></span><span class="val">' + (o.val < 0 ? "–" : o.val) + '</span><span class="bar"><i style="width:' + (v / 1.27) + '%"></i></span></button>';
  }).join("");
}
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    st = await r.json();
    $("status").textContent = "";
    if (editing < 0) render();
  } catch (e) { $("status").textContent = "keine Verbindung zur Force"; }
  setTimeout(poll, 250);
}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-slot]");
  if (!b || +b.dataset.slot < 0) return;
  editing = +b.dataset.slot;
  const cur = (st.knobs.concat(st.pads, st.others).find((x) => x.slot === editing) || {}).label || "";
  $("sh-title").textContent = b.dataset.what + " · Slot " + (editing + 1);
  $("sh-name").value = cur;
  $("sheet").hidden = false;
  $("sh-name").focus();
});
async function save(name) {
  const slot = editing;
  close_();
  try { await fetch("/label?slot=" + (slot + 1) + "&name=" + encodeURIComponent(name)); } catch (e) {}
}
function close_() { editing = -1; $("sheet").hidden = true; render(); }
$("sh-save").addEventListener("click", () => save($("sh-name").value.trim()));
$("sh-clear").addEventListener("click", () => save(""));
$("sh-cancel").addEventListener("click", close_);
$("sh-name").addEventListener("keydown", (e) => { if (e.key === "Enter") save($("sh-name").value.trim()); if (e.key === "Escape") close_(); });
poll();
</script>
</body>
</html>

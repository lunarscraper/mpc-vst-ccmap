# CC Map MPC skin layout: 4 x 2 large controls per tab on the grid of mpc-vst-rattler (r=48), in the
# order of the Force's eight Q-Links. No small touch fields: every editor field is a knob,
# a big button or a popup (no small toggles), and LEARN takes the source from the controller itself.
# MAP and RANGE edit the slot chosen with SLOT (both tabs show the same slot and its SOURCE).
# SETUP holds the settings that are not per slot, SYNC the value feedback to the controllers (Faderfox
# EC4, OXI E16), pickup for pots and the phone view with its address, PRESET the 32 preset slots.
# Labels: popups and readouts carry their text in caption="..." (label "-", so gen_vst.py bakes
# nothing there); captions.py draws them, the button texts and popup list options in Titillium Web
# at the knob names' size (as in mpc-vst-euclidier / mpc-vst-drumgen).
# Palette: graphite panel, warm white print, signal orange accents.
style=td3
theme_bg=1c1e22
theme_panel=2a2d33
theme_line=121316
theme_ink=f0ece4
theme_ink_dim=aaa69c
theme_ink_faint=62605a
theme_accent=ff8a2a
theme_accent_hi=ffb36b
theme_knob_face=121316
theme_knob_ring=000000
theme_bar=ff8a2a
theme_seg_active=ff8a2a
theme_seg_inactive=121316
theme_seg_active_tx=141414
theme_btn_text=141414
theme_well=0e0f11
theme_knob_off=4c4f56
theme_tab_on=ff8a2a
theme_tab_on_tx=141414
theme_lcd=0b0c0e
theme_box=202227
theme_btn_bg=f0ece4
theme_chrome_ink=f0ece4
theme_go_on=ff8a2a
theme_go_off=ffb36b
theme_tabs=ff8a2a

[tab MAP]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="SLOT" key=slot
readout cx=490 cy=250 w=300 h=48 label="-" caption="SOURCE" key=source
button cx=790 cy=260 label="LEARN" key=learn
popup cx=1090 cy=250 w=220 h=48 label="-" caption="PAGE" key=page
popup cx=190 cy=530 w=220 h=48 label="-" caption="OUT" key=out
knob cx=490 cy=530 r=48 label="CHANNEL" key=ch
popup cx=790 cy=530 w=220 h=48 label="-" caption="TYPE" key=type
knob cx=1090 cy=530 r=48 label="NUMBER" key=num
qlinks "MAP" = slot,learn,page,out,ch,type,num

[tab RANGE]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="SLOT" key=slot
readout cx=490 cy=250 w=300 h=48 label="-" caption="SOURCE" key=source
popup cx=790 cy=250 w=220 h=48 label="-" caption="BUTTON" key=btn
button cx=1090 cy=260 label="CLEAR" key=clear
knob cx=190 cy=530 r=48 label="MIN" key=lo
knob cx=490 cy=530 r=48 label="MAX" key=hi
popup cx=790 cy=530 w=220 h=48 label="-" caption="ENCODER" key=enc
readout cx=1090 cy=530 w=260 h=48 label="-" caption="LAST" key=monitor
qlinks "RANGE" = slot,btn,clear,lo,hi,enc

[tab SETUP]
frame x=36 y=88 w=1207 h=624 title=""
popup cx=190 cy=250 w=220 h=48 label="-" caption="ACTIVE PAGE" key=cur_page
popup cx=490 cy=250 w=220 h=48 label="-" caption="FOLLOW" key=follow
popup cx=790 cy=250 w=240 h=48 label="-" caption="LEDS" key=leds
popup cx=1090 cy=250 w=220 h=48 label="-" caption="UNMAPPED" key=thru
popup cx=190 cy=530 w=240 h=48 label="-" caption="LINK A" key=link
popup cx=490 cy=530 w=240 h=48 label="-" caption="INPUT" key=input
popup cx=790 cy=530 w=240 h=48 label="-" caption="ARROWS" key=arrows
readout cx=1090 cy=530 w=260 h=48 label="-" caption="LC TEMPLATE" key=template
qlinks "SETUP" = cur_page,follow,leds,thru,link,input,arrows

[tab SYNC]
frame x=36 y=88 w=1207 h=624 title=""
popup cx=190 cy=250 w=240 h=48 label="-" caption="FEEDBACK" key=feedback
popup cx=490 cy=250 w=220 h=48 label="-" caption="TAKEOVER" key=takeover
button cx=790 cy=260 label="SEND VALUES" key=send
popup cx=1090 cy=250 w=220 h=48 label="-" caption="PHONE VIEW" key=web
readout cx=340 cy=530 w=520 h=48 label="-" caption="LAST" key=monitor
readout cx=940 cy=530 w=480 h=48 label="-" caption="OPEN ON PHONE: HTTP://" key=web_addr
qlinks "SYNC" = feedback,takeover,send,web

[tab PRESET]
frame x=36 y=88 w=1207 h=624 title=""
button cx=340 cy=390 label="LOAD" key=load
knob cx=640 cy=380 r=48 label="PRESET" key=preset
button cx=940 cy=390 label="SAVE" key=save
qlinks "PRESET" = preset,load,save
